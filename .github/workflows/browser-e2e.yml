name: Chromium installed-extension QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: false
          package-manager-cache: false
      - name: Source gates
        run: |
          npm run check
          npm test
      - name: Install isolated browser harness
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.65.1
      - name: Install reproducible Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run actual installed-extension network tests
        run: npm run test:browser

      - name: Preserve real installed-popup screenshot for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sift-popup-review
          path: artifacts/sift-popup-*.png
          retention-days: 7
          if-no-files-found: error
