name: Public visibility policy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify GitHub reports the repository is public
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}" --jq '{private: .private, visibility: .visibility}' > /tmp/sift-visibility.json
          python3 - <<'PY'
          import json
          with open('/tmp/sift-visibility.json',encoding='utf-8') as stream:
              repo=json.load(stream)
          if repo.get('private') is not False or repo.get('visibility') != 'public':
              raise SystemExit('CRITICAL: SIFT EXT GitHub repository is not public')
          print('GitHub reports the SIFT EXT repository is publicly visible')
          PY
      - name: Independently probe anonymous public README delivery
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --retry 2 \
            --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/0xdx-au/sift-ext/main/README.md" \
            -o /tmp/sift-public-readme; then
            grep -q 'SIFT EXT' /tmp/sift-public-readme
            echo 'Anonymous README retrieval verified'
          else
            echo '::warning::Anonymous CDN reachability inconclusive (rate limit or edge restriction); authenticated GitHub visibility metadata was verified separately.'
          fi
