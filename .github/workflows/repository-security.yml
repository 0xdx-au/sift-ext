name: Repository hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 26 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: false
          package-manager-cache: false
      - name: Check rights and disclosure files
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s COMMERCIAL.md
          test -s SECURITY.md
      - name: Check tracked secret file names
        run: |
          set -euo pipefail
          if git ls-files | grep -E -i '(^|/)(\.env($|\.)|secrets?/|private/)|\.(pem|key|p8|p12|pfx)$'; then
            echo 'Potential private material in version control' >&2
            exit 1
          fi
      - name: Check obvious credential patterns
        run: |
          set -euo pipefail
          if git grep -n -E '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,})' -- . ':!*.md' ':!.github/workflows/repository-security.yml'; then
            echo 'Potential credential exposed; halt release and investigate' >&2
            exit 1
          fi
